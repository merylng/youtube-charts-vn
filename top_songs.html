<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Charts VN - Top Songs Playlist</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #17171b;
      --panel-2: #222228;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #ff0033;
      --line: #303036;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(255, 0, 51, 0.22), transparent 36rem), var(--bg);
      color: var(--text);
    }

    .app {
      width: min(1400px, calc(100% - 28px));
      margin: 0 auto;
      padding: 14px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 2px;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle, .status, .meta {
      color: var(--muted);
      margin: 0;
      font-size: 13.5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      white-space: nowrap;
      font-size: 13px;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .updated-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 16px;
      align-items: start;
    }

    .player-card, .list-card {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: rgba(23, 23, 27, 0.86);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .player-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
    }

    .player-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      align-self: start;
    }

    #player { width: 100%; height: 100%; }

    .now-playing {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 18px;
    }

    .rank {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .title {
      margin: 4px 0;
      font-size: clamp(19px, 1.8vw, 25px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .artists { color: var(--muted); font-size: 14px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    button:hover { transform: translateY(-1px); background: #303039; }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #e6002e; }

    .list-card {
      max-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 12px;
    }

    .list-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .list-head h2 { margin: 0 0 4px; font-size: 18px; }
    .status { font-size: 13px; }

    .song-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 6px;
    }

    .song {
      width: 100%;
      display: grid;
      grid-template-columns: 40px 44px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 8px;
      border-radius: 14px;
      background: transparent;
    }

    .song.active { background: rgba(255, 0, 51, 0.15); }
    .song .num { color: var(--muted); font-weight: 800; text-align: center; font-size: 13px; }
    .song img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: #111; }
    .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 14px; }
    .song-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12.5px; margin-top: 2px; }

    .lyrics {
      position: relative;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
      height: min(46vh, 300px);
      overflow: auto;
    }

    .lyrics h3 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lyrics .no-lyrics {
      color: var(--muted);
    }

    .lyrics .lrc-line {
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .lyrics .lrc-line.active {
      color: var(--accent, #fff);
      font-weight: 700;
    }

    .lyrics .lrc-line:not(.active) {
      color: var(--muted);
    }

    .lyrics .lrc-subline + .lrc-subline {
      margin-top: 2px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      text-decoration: none;
      font-weight: 800;
      font-size: 13.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    @media (max-width: 1200px) {
      .layout { grid-template-columns: minmax(0, 1fr) 360px; }
      .player-card { grid-template-columns: minmax(0, 1fr) 300px; }
    }

    @media (max-width: 1000px) {
      .player-card { display: block; }
      .now-playing { display: block; }
      .lyrics { height: auto; max-height: 320px; }
    }

    @media (max-width: 920px) {
      header, .layout { display: block; }
      .badge { margin-top: 12px; }
      .list-card { position: static; max-height: none; margin-top: 16px; }
    }
  </style>
</head>

      </aside>
    </section>
  </main>

      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('vi-VN', {
        timeZone: 'Asia/Ho_Chi_Minh',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function formatViews(value) {
      const views = Number(value || 0);
      if (!views) return 'Views: --';
      return `${views.toLocaleString('vi-VN')} views`;
    }

    function formatChartDate(value) {
      const cleaned = String(value).replace(/-/g, '');
      if (!/^\d{8}$/.test(cleaned)) return value || 'tuần mới nhất';
      const end = new Date(`${cleaned.slice(0, 4)}-${cleaned.slice(4, 6)}-${cleaned.slice(6, 8)}T00:00:00`);
      const start = new Date(end);
      start.setDate(end.getDate() - 6);
      return `${start.toLocaleDateString('vi-VN')} - ${end.toLocaleDateString('vi-VN')}`;
    }

    async function init() {
      try {
        const chart = await getChart();
        songs = chart.songs;
        if (!songs.length) throw new Error('YouTube Charts trả về danh sách rỗng');
        els.range.textContent = `Tuần mới nhất: ${formatChartDate(chart.rangeEnd)}`;
        els.updatedAt.textContent = `Last Updated Time: ${formatUpdatedAt(chart.updatedAt)}`;
        els.status.textContent = `${songs.length} bài hát từ YouTube Charts`;
      } catch (error) {
        els.range.textContent = 'Không tải được chart';
        els.status.textContent = 'Không có dữ liệu để phát';
        els.nowTitle.textContent = 'Không tải được playlist';
        els.nowArtists.textContent = error.message;
        return;
      }

      renderList();
      loadSong(0, false);
    }

    // Legacy string values are treated as plain text; dict shape is { synced, plain }.
    function normalizeSongLyrics(lyrics) {
      if (typeof lyrics === 'string') return { synced: '', plain: lyrics };
      if (lyrics && typeof lyrics === 'object') {
        return {
          synced: typeof lyrics.synced === 'string' ? lyrics.synced : '',
          plain: typeof lyrics.plain === 'string' ? lyrics.plain : '',
        };
      }
      return { synced: '', plain: '' };
    }

    function renderList() {
      els.list.innerHTML = songs.map((song, index) => `
        <button class="song ${index === currentIndex ? 'active' : ''}" data-index="${index}">
          <span class="num">#${song.rank}</span>
          <img src="${song.thumbnail || getThumbnail(song.videoId)}" alt="" loading="lazy">
          <span>
            <span class="song-name">${escapeHtml(song.title)}</span>
            <span class="song-artist">${escapeHtml(song.artists)}</span>
          </span>
        </button>
      `).join('');

      els.list.querySelectorAll('.song').forEach(button => {
        button.addEventListener('click', () => loadSong(Number(button.dataset.index), true));
      });
    }

    function loadSong(index, autoplay) {
      if (!songs.length) return;
      currentIndex = (index + songs.length) % songs.length;
      const song = songs[currentIndex];
      els.nowRank.textContent = `#${song.rank}`;
      els.nowTitle.textContent = song.title;
      els.nowArtists.textContent = song.artists;
      els.nowViews.textContent = formatViews(song.views);
      const { synced, plain } = normalizeSongLyrics(song.lyrics);
      // Music videos (isMv) have extra intro/outro/visuals, so their timeline
      // does not match the track's LRC timestamps — show static plain lyrics.
      if (song.isMv && plain.trim()) {
        els.lyrics.innerHTML = escapeHtml(plain);
        stopLyricsSync();
      } else if (synced.trim()) {
        lrcLines = parseLrc(synced, plain);
        if (lrcLines.length) {
          els.lyrics.innerHTML = lrcLines.map(line =>
            `<div class="lrc-line">${line.displayLines.map(text => `<div class="lrc-subline">${escapeHtml(text)}</div>`).join('')}</div>`
          ).join('');
          activeLrcIndex = -1; // force re-highlight after DOM rebuild
          highlightLrcLine(0, false);
          startLyricsSync();
        } else {
          els.lyrics.innerHTML = '<div class="no-lyrics">Không có lời bài hát cho bài này.</div>';
          stopLyricsSync();
        }
      } else if (plain.trim()) {
        els.lyrics.innerHTML = escapeHtml(plain);
        stopLyricsSync();
      } else {
        els.lyrics.innerHTML = '<div class="no-lyrics">Không có lời bài hát cho bài này.</div>';
        stopLyricsSync();
      }
      renderList();

      if (!playerReady || !song.videoId) {
        pendingLoad = { index: currentIndex, autoplay };
        return;
      }
      pendingLoad = null;
      if (autoplay) player.loadVideoById(song.videoId);
      else player.cueVideoById(song.videoId);
      updatePlayButton();
    }

    function nextSong(autoplay) { loadSong(currentIndex + 1, autoplay); }
    function prevSong() { loadSong(currentIndex - 1, true); }

    function shuffleSong(autoplay) {
      if (!songs.length) return;
      if (songs.length === 1) {
        loadSong(0, autoplay);
        return;
      }
      let nextIndex = currentIndex;
      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * songs.length);
      }
      loadSong(nextIndex, autoplay);
    }

    function updatePlayButton() {
      if (!playerReady) return;
      els.play.textContent = player.getPlayerState() === YT.PlayerState.PLAYING ? 'Pause' : 'Play';
    }

    function updateRepeatButton() {
      els.repeat.textContent = repeatEnabled ? 'Repeat: On' : 'Repeat: Off';
      els.repeat.classList.toggle('primary', repeatEnabled);
      els.repeat.setAttribute('aria-pressed', String(repeatEnabled));
    }

    function updateShuffleButton() {
      els.shuffle.textContent = shuffleEnabled ? 'Shuffle: On' : 'Shuffle: Off';
      els.shuffle.classList.toggle('primary', shuffleEnabled);
      els.shuffle.setAttribute('aria-pressed', String(shuffleEnabled));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    // Parse LRC text ("[mm:ss.xx]line" or "[mm:ss]line", multiple timestamps
    // per line allowed) into timed lyric events. LRCLIB sometimes groups several
    // lyric sentences into one timestamp, so plain lyrics are used to split those
    // events into visual sub-lines without changing their timing.
    function parseLrc(lrcText, plainText) {
      const lines = [];
      const plainLines = String(plainText || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const plainCursor = { index: 0 };
      const lineRegex = /^(?:\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\])+(.*)$/;
      for (const rawLine of String(lrcText).split(/\r?\n/)) {
        const match = lineRegex.exec(rawLine);
        if (!match) continue;
        const text = match[4].trim();
        if (!text) continue;
        let earliest = Infinity;
        const timeRegex = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
        let timeMatch;
        while ((timeMatch = timeRegex.exec(rawLine)) !== null) {
          const minutes = Number(timeMatch[1]);
          const seconds = Number(timeMatch[2]);
          const fractionDigits = timeMatch[3];
          let fraction;
          if (!fractionDigits) fraction = 0;
          else if (fractionDigits.length === 1) fraction = Number(fractionDigits) * 10; // [mm:ss.x] -> tenths as hundredths
          else if (fractionDigits.length === 2) fraction = Number(fractionDigits);   // [mm:ss.xx] -> hundredths
          else fraction = Math.round(Number(fractionDigits) / 10);                   // [mm:ss.xxx] -> thousandths, rounded to hundredths
          const total = minutes * 60 + seconds + fraction / 100;
          if (total < earliest) earliest = total;
        }
        lines.push({
          time: Math.round(earliest * 100) / 100,
          text,
          displayLines: splitLrcDisplayLines(text, plainLines, plainCursor),
        });
      }
      return lines;
    }

    function compactLyricText(value) {
      return String(value)
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '');
    }

    function splitLrcDisplayLines(text, plainLines, cursor) {
      const compactLrc = compactLyricText(text);
      if (!compactLrc || !plainLines.length) return [text];
      for (let start = cursor.index; start < plainLines.length; start++) {
        let combined = '';
        const matched = [];
        for (let index = start; index < plainLines.length; index++) {
          const compactLine = compactLyricText(plainLines[index]);
          if (!compactLine) continue;
          const nextCombined = combined + compactLine;
          if (!compactLrc.includes(nextCombined)) break;
          matched.push(plainLines[index]);
          combined = nextCombined;
          cursor.index = index + 1;
          if (combined === compactLrc) return matched;
        }
        if (matched.length && combined.length >= compactLrc.length * 0.85) return matched;
      }
      return [text];
    }

    function highlightLrcLine(index, scroll) {
      if (!lrcLines.length || !els.lyrics) return;
      if (index === activeLrcIndex) return;
      if (activeLrcIndex >= 0 && activeLrcIndex < lrcLines.length) {
        els.lyrics.children[activeLrcIndex].classList.remove('active');
      }
      activeLrcIndex = index;
      if (index >= 0 && index < lrcLines.length) {
        const lineEl = els.lyrics.children[index];
        lineEl.classList.add('active');
        // Scroll only the lyrics panel (it is position: relative and the
        // scroll container), not the whole page.
        if (scroll && els.lyricsPanel) {
          const panel = els.lyricsPanel;
          const target = lineEl.offsetTop - panel.clientHeight / 2;
          panel.scrollTop = Math.max(0, Math.min(target, panel.scrollHeight - panel.clientHeight));
        }
      }
    }

    function updateLrcHighlight() {
      if (!lrcLines.length || !playerReady || !player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime() || 0;
      let index = 0;
      for (let i = 0; i < lrcLines.length; i++) {
        if (lrcLines[i].time <= currentTime) index = i;
        else break;
      }
      highlightLrcLine(index, true);
    }

    function startLyricsSync() {
      stopLyricsSync();
      if (!lrcLines.length) return;
      updateLrcHighlight();
      lyricsSyncTimer = setInterval(updateLrcHighlight, 250);
    }

    function stopLyricsSync() {
      if (lyricsSyncTimer !== null) {
        clearInterval(lyricsSyncTimer);
        lyricsSyncTimer = null;
      }
    }

    els.prev.addEventListener('click', prevSong);
    els.next.addEventListener('click', () => nextSong(true));
    els.repeat.addEventListener('click', () => {
      repeatEnabled = !repeatEnabled;
      updateRepeatButton();
    });
    els.play.addEventListener('click', () => {
      if (!songs.length) return;
      if (!playerReady) {
        pendingLoad = { index: currentIndex, autoplay: true };
        return;
      }
      const song = songs[currentIndex];
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else if (state === YT.PlayerState.CUED || state === YT.PlayerState.PAUSED) player.playVideo();
      else player.loadVideoById(song.videoId);
    });
    els.shuffle.addEventListener('click', () => {
      shuffleEnabled = !shuffleEnabled;
      updateShuffleButton();
    });

    updateRepeatButton();
    updateShuffleButton();
    init();
  </script>
</body>
</html>
